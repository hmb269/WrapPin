name: Build IPA

# Builds the unsigned Standard (SideStore) IPA on a GitHub-hosted Mac and
# publishes it as a GitHub Release, so no local Xcode is needed.
# Runs on every push to the custom branch, or manually from the Actions tab.

on:
  push:
    branches: [custom-features]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27 is provided by its own runner image label.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          XCODE="$(ls -d /Applications/Xcode_27*.app /Applications/Xcode-27*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version
          if ! xcodebuild -version | head -n 1 | grep -q "Xcode 27"; then
            echo "Xcode 27 is required. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi

      - name: Offline checks
        run: |
          python3 scripts/check-localization.py
          xcrun swiftc -parse-as-library scripts/test-tunnel-handoff.swift \
            WrapPin/Models/AppPreferences.swift WrapPin/App/BuildEdition.swift -o "$RUNNER_TEMP/check-handoff"
          "$RUNNER_TEMP/check-handoff"
          xcrun swiftc -parse-as-library scripts/check-fixed-coordinate-mode.swift \
            WrapPin/Services/FixedCoordinateMode.swift WrapPin/Models/LocationTarget.swift \
            WrapPin/Models/SessionRecoveryRecord.swift -o "$RUNNER_TEMP/check-coordinates"
          "$RUNNER_TEMP/check-coordinates"

      - name: Build unsigned IPA
        run: |
          OUTPUT_DIR="$RUNNER_TEMP/out" zsh scripts/package-ipa.sh standard
          # Also repack with Info-ZIP for signing apps whose ZIP reader rejects ditto's layout.
          IPA="$(ls "$RUNNER_TEMP"/out/*-unsigned.ipa | head -n 1)"
          mkdir -p "$RUNNER_TEMP/repack"
          (cd "$RUNNER_TEMP/repack" && unzip -q "$IPA" && zip -qr -X -y "${IPA%-unsigned.ipa}-compat.ipa" Payload)
          unzip -tq "${IPA%-unsigned.ipa}-compat.ipa"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: WrapPin-unsigned-ipa
          path: ${{ runner.temp }}/out/*.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' Configuration/Version.xcconfig | tail -n 1)"
          BUILD="$(sed -n 's/^CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*//p' Configuration/Version.xcconfig | tail -n 1)"
          TAG="v${VERSION}"
          IPA="$(ls "$RUNNER_TEMP"/out/*-unsigned.ipa | head -n 1)"
          COMPAT="${IPA%-unsigned.ipa}-compat.ipa"
          SHA="$(shasum -a 256 "$IPA" | cut -d ' ' -f 1)"
          COMPAT_SHA="$(shasum -a 256 "$COMPAT" | cut -d ' ' -f 1)"
          {
            echo "自用版 WrapPin ${VERSION}（Build ${BUILD}），基于 suversal/WrapPin。"
            echo
            echo "新增：Quantumult X 隧道选项、快捷指令、从地图链接开始模拟、收藏导入导出、定时恢复真实位置。"
            echo
            echo "安装：下载下面的 .ipa，用 SideStore 安装（My Apps → +）。若签名工具提示无法打开 ZIP，改用 -compat.ipa。"
            echo
            echo "SHA-256（unsigned）: \`${SHA}\`"
            echo
            echo "SHA-256（compat）: \`${COMPAT_SHA}\`"
            echo
            echo "Commit: ${GITHUB_SHA}"
          } > "$RUNNER_TEMP/notes.md"
          # One release per version; a new build replaces the previous one.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$IPA" "$COMPAT" \
            --target "$GITHUB_SHA" \
            --title "WrapPin 自用版 ${VERSION} (Build ${BUILD})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
